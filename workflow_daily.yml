name: Miks energii - aktualizacja dzienna

on:
  schedule:
    - cron: "53 0 * * 1-5"      # pon.-pt. 00:53 UTC = 02:53 czasu letniego w Polsce (01:53 zimą); zapas na opóźnienia startów GitHub (do ~3 h) przed odświeżeniem o 5:40
    - cron: "37 12 * * 1-5"     # przebieg popołudniowy: 12:37 UTC = 14:37 latem (13:37 zimą) - tylko ceny day-ahead na jutro (ok. 10 min), przed odświeżeniem o 16:40
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit czasu pobierania w minutach"
        required: false
        default: "240"
      only:
        description: "Tylko te kraje, np. PL,DE (puste = wszystkie)"
        required: false
        default: ""
      afternoon:
        description: "Przebieg popołudniowy (tylko ceny day-ahead na jutro)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: energy-mix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m pytest -q

      - name: Pobranie danych, trendy, dashboard
        env:
          BUDGET: ${{ github.event.inputs.budget || '80' }}
          ONLY: ${{ github.event.inputs.only || '' }}
          AFTERNOON: ${{ github.event.schedule == '37 12 * * 1-5' || github.event.inputs.afternoon == 'true' }}
        run: |
          if [ "$AFTERNOON" = "true" ]; then
            python -m mixtracker.run_daily --budget 15 --afternoon
          else
            python -m mixtracker.run_daily --budget "$BUDGET" --only "$ONLY"
          fi

      - name: Zapis danych w repozytorium
        if: always()
        env:
          SUFFIX: ${{ (github.event.schedule == '37 12 * * 1-5' || github.event.inputs.afternoon == 'true') && ' (popołudnie)' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Dane z $(date -u +%Y-%m-%d)${SUFFIX}"
          # do tej samej gałęzi pisze też „Wspólna pogoda” - ponowienia przy kolizji
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          echo "::error::Nie udało się zapisać danych po 5 próbach"
          exit 1

      - name: Dashboard do pobrania (zakładka Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          retention-days: 30

      - name: Przygotowanie strony GitHub Pages
        if: vars.PAGES != 'off'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    if: vars.PAGES != 'off'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
