name: Miks energii - aktualizacja dzienna

on:
  schedule:
    - cron: "53 0 * * *"        # codziennie 00:53 UTC = 02:53 czasu letniego w Polsce (01:53 zimą); zapas na opóźnienia startów GitHub (do ~3 h) przed odświeżeniem o 5:40
    - cron: "37 12 * * *"       # przebieg popołudniowy (codziennie): 12:37 UTC = 14:37 latem (13:37 zimą) - tylko ceny day-ahead na jutro (ok. 10 min), przed odświeżeniem o 16:40
    - cron: "7 14 * * *"        # B-20261027-1: uzupełnienie cen na jutro dla stref, których nie było przy 12:37 (2–3 min; przy komplecie bez commitu)
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit czasu pobierania w minutach"
        required: false
        default: "240"
      only:
        description: "Tylko te kraje, np. PL,DE (puste = wszystkie)"
        required: false
        default: ""
      afternoon:
        description: "Przebieg popołudniowy (tylko ceny day-ahead na jutro)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: energy-mix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      run: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      # B-20261028-5: przebieg uzupełniający 14:07 UTC tylko wtedy, gdy któraś strefa nie ma jeszcze ceny na jutro
      - name: Czy brakuje cen na jutro
        id: need
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "7 14 * * *" ]; then
            t=$(date -u -d tomorrow +%Y-%m-%d); miss=0; brak=""
            for f in data/prices/*.csv; do
              d=$(tail -1 "$f" | cut -d, -f1 | cut -c1-10)
              if [[ "$d" < "$t" ]]; then miss=1; brak="$brak $(basename "$f" .csv)"; fi
            done
            echo "run=$miss" >> "$GITHUB_OUTPUT"
            if [ "$miss" = "0" ]; then echo "Wszystkie strefy mają cenę na $t – przebieg uzupełniający pominięty."; else echo "Bez ceny na $t:$brak"; fi
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        if: steps.need.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Testy
        if: steps.need.outputs.run == '1'
        run: python -m pytest -q

      - name: Pobranie danych, trendy, dashboard
        if: steps.need.outputs.run == '1'
        env:
          BUDGET: ${{ github.event.inputs.budget || '80' }}
          ONLY: ${{ github.event.inputs.only || '' }}
          AFTERNOON: ${{ github.event.schedule == '37 12 * * *' || github.event.schedule == '7 14 * * *' || github.event.inputs.afternoon == 'true' }}
          ONLY_MISSING: ${{ github.event.schedule == '7 14 * * *' }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}   # U-20261027: zużycie UK/NI i dane NL z ENTSO-E (bez sekretu – pominięte)
        run: |
          if [ "$AFTERNOON" = "true" ]; then
            extra=""; [ "$ONLY_MISSING" = "true" ] && extra="--only-missing"
            python -m mixtracker.run_daily --budget 40 --afternoon $extra   # B-20261025-1: zapas na 2 ponowienia brakujących cen co 10 min
          else
            python -m mixtracker.run_daily --budget "$BUDGET" --only "$ONLY"
          fi

      - name: Zapis danych w repozytorium
        if: always() && steps.need.outputs.run == '1'
        env:
          SUFFIX: ${{ (github.event.schedule == '37 12 * * *' || github.event.schedule == '7 14 * * *' || github.event.inputs.afternoon == 'true') && ' (popołudnie)' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Dane z $(date -u +%Y-%m-%d)${SUFFIX}"
          # do tej samej gałęzi pisze też „Wspólna pogoda” - ponowienia przy kolizji
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          echo "::error::Nie udało się zapisać danych po 5 próbach"
          exit 1

      - name: Dashboard do pobrania (zakładka Actions)
        if: steps.need.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          retention-days: 30

      - name: Przygotowanie strony GitHub Pages
        if: vars.PAGES != 'off' && steps.need.outputs.run == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    if: vars.PAGES != 'off' && needs.update.outputs.run == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
