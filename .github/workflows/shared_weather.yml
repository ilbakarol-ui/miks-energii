name: Wspólna pogoda dla dashboardów

# Cała pogoda dla raportu Gaz UE (i innych dashboardów) pobierana tutaj, do data/shared_weather/:
# - zadanie "temp": pogoda do prognoz Miksu energii (wiatr, słońce, temperatura dla punktów z config/weather_points.csv –
#   pliki power_*; Miks energii nie pyta już Open-Meteo sam) oraz temperatura dla miast UE i Azji – archiwum ERA5,
#   bieżąca prognoza, dawne prognozy (wyprzedzenie 0-7 dni),
# - zadanie "extra": ensemble ECMWF (51 wariantów) do prognozy energetyki i prognoza sezonowa SEAS5.
# Zadania idą równolegle na osobnych maszynach (osobny limit Open-Meteo). Dwa razy dziennie, także w weekendy:
# - 00:17 UTC – pełny przebieg (zadania temp i extra; start planowany bywa opóźniony nawet o 3 godziny), przed raportem
#   gazowym o 5:41,
# - 17:47 UTC – lekki przebieg wieczorny (zadanie evening, limit 25 min): tylko świeża prognoza temperatury, pogoda do prognoz
#   Miksu energii (zapas na noc, gdy Open-Meteo nie odpowiada) i ensemble do energetyki, zapis w meta_evening.json; przed wieczornym raportem gazowym o 20:41 (czas polski). ERA5, dawne
#   prognozy i SEAS5 – tylko w nocy.
# Łańcuch (28.11.2026): GitHub opóźnia harmonogram „Miks energii” o wiele godzin, a ten workflow startuje prawie na czas,
# więc po zadaniu temp (noc) uruchamia przebieg nocny energii, gdy nie ma jeszcze commita „Dane z <dziś>”, a po zadaniu
# evening – przebieg popołudniowy, gdy któraś strefa nie ma ceny na jutro (API workflow_dispatch, token GITHUB_TOKEN). Repozytorium jest publiczne, więc minuty GitHub Actions nie liczą się do limitu.
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 17 * * *"
    # 27.11.2026: zapasy 03:41 i 18:53 UTC (B-20261116-1) usunięte – dwa starty dziennie (nocny i wieczorny);
    # bramka „need” zostaje (spóźnione zdarzenie, gdy zadanie zapisało już dziś dane, kończy się po kilku sekundach)
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit zapytań ważonych Open-Meteo w jednym zadaniu"
        required: false
        default: "8000"
      minutes:
        description: "Limit czasu pobierania w minutach (np. 100 przy jednorazowym dociąganiu historii)"
        required: false
        default: "35"
      evening:
        description: "Lekki przebieg wieczorny (tylko prognoza temperatury i ensemble)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write   # 28.11.2026: łańcuch – uruchamia brakujący przebieg „Miks energii” (krok „chain”)

concurrency:
  group: shared-weather
  cancel-in-progress: false

jobs:
  weather:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON((github.event.schedule == '47 17 * * *' || github.event.schedule == '53 18 * * *' || github.event.inputs.evening == 'true') && '["evening"]' || '["temp","extra"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # B-20261116-1: bramka zapasu sprawdza dzisiejsze commity (od B-20261119-1 na origin/main)

      # B-20261116-1: start zapasowy (41 3 / 53 18) tylko wtedy, gdy zadanie nie zapisało dziś danych
      - name: Czy zadanie już było dziś
        id: need
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ matrix.job }}
        run: |
          # B-20261117-1 / B-20261119-1: bramka na aktualnym main (spóźnione zdarzenie ma checkout z chwili utworzenia)
          if git fetch -q origin main 2>/dev/null; then REF=origin/main; else REF=HEAD; fi
          t=$(date -u +%Y-%m-%d); H=${GATE_HOUR:-$(date -u +%H)}
          run=1
          if [ -n "$SCHEDULE" ]; then
            if [ "$JOB" = "evening" ] && [ "$((10#$H))" -lt 12 ]; then
              # wieczorny start, który przyszedł po północy – za chwilę jest przebieg nocny, a data byłaby z następnego dnia
              run=0; echo "Wieczorny przebieg po północy ($H UTC) – pominięty."
            elif git log "$REF" -80 --format=%s | grep -qxF "Wspólna pogoda $JOB $t"; then
              run=0; echo "Zadanie $JOB już dziś zapisało dane – $SCHEDULE pominięty."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "1" ] && [ "$REF" = "origin/main" ]; then git reset -q --hard origin/main; fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        if: steps.need.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Test modułu
        if: steps.need.outputs.run == '1'
        run: python -m pytest -q tests/test_shared_weather.py

      - name: Pobranie pogody (${{ matrix.job }})
        if: steps.need.outputs.run == '1'
        timeout-minutes: 115
        env:
          BUDGET: ${{ github.event.inputs.budget || '8000' }}
          MINUTES: ${{ matrix.job == 'evening' && '25' || github.event.inputs.minutes || '35' }}
        run: python -m mixtracker.shared_weather --job ${{ matrix.job }} --budget "$BUDGET" --minutes "$MINUTES"

      - name: Zapis w repozytorium
        if: always() && steps.need.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared_weather
          git diff --cached --quiet && exit 0
          # B-20261119-1: wieczorny commit podpisany datą prognozy (forecast_issued), nie zegarem startu
          D=""
          if [ "${{ matrix.job }}" = "evening" ]; then
            D=$(python3 -c "import json;print(json.load(open('data/shared_weather/meta_evening.json')).get('forecast_issued') or '')" 2>/dev/null || true)
          fi
          git commit -m "Wspólna pogoda ${{ matrix.job }} ${D:-$(date -u +%Y-%m-%d)}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          exit 1

      # 28.11.2026: łańcuch do „Miks energii” – zamiast zadania Claude, które uruchamiało brakujące przebiegi ręcznie
      - name: Brakujący przebieg energii
        id: chain
        if: always() && (matrix.job == 'temp' || matrix.job == 'evening')
        continue-on-error: true
        env:
          JOB: ${{ matrix.job }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git fetch -q origin main 2>/dev/null; then REF=origin/main; else REF=HEAD; fi
          t=$(date -u +%Y-%m-%d); tm=$(date -u -d tomorrow +%Y-%m-%d); h=$((10#${GATE_HOUR:-$(date -u +%H)}))
          has() { git log "$REF" -80 --format=%s | grep -qxF "$1"; }
          d=""
          if [ "$JOB" = "temp" ]; then
            if has "Dane z $t"; then echo "Przebieg nocny energii już był („Dane z $t”)."; else d=night; fi
          elif [ "$h" -lt 12 ]; then
            echo "Wieczorny przebieg po północy ($h UTC) – bez uruchamiania przebiegu popołudniowego."
          else
            brak=""
            for f in $(git ls-tree --name-only "$REF" data/prices/ | grep '\.csv$'); do
              x=$(git show "$REF:$f" | tail -1 | cut -d, -f1 | cut -c1-10)
              if [[ "$x" < "$tm" ]]; then brak="$brak $(basename "$f" .csv)"; fi
            done
            if [ -n "$brak" ]; then d=afternoon; echo "Bez ceny na $tm:$brak"; else echo "Wszystkie strefy mają cenę na $tm."; fi
          fi
          echo "dispatch=$d" >> "$GITHUB_OUTPUT"
          if [ -z "$d" ] || [ -n "$CHAIN_DRY" ]; then exit 0; fi
          busy=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status != "completed")] | length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then echo "Przebieg energii już trwa albo czeka w kolejce – bez uruchamiania."; exit 0; fi
          if [ "$d" = "afternoon" ]; then
            gh api -X POST "repos/$REPO/actions/workflows/daily.yml/dispatches" -f ref=main -F 'inputs[afternoon]=true'
          else
            gh api -X POST "repos/$REPO/actions/workflows/daily.yml/dispatches" -f ref=main
          fi
          echo "Uruchomiono przebieg energii: $d."
