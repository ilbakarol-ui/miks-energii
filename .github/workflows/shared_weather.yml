name: Wspólna pogoda dla dashboardów

# Cała pogoda dla raportu Gaz UE (i innych dashboardów) pobierana tutaj, do data/shared_weather/:
# - zadanie "temp": temperatura dla miast UE i Azji – archiwum ERA5, bieżąca prognoza, dawne prognozy (wyprzedzenie 0-7 dni),
# - zadanie "extra": ensemble ECMWF (51 wariantów) do prognozy energetyki i prognoza sezonowa SEAS5.
# Zadania idą równolegle na osobnych maszynach (osobny limit Open-Meteo). Dwa razy dziennie, także w weekendy:
# - 00:17 UTC – wcześnie rano (start planowany bywa opóźniony nawet o 3 godziny), żeby zdążyć przed raportem gazowym o 5:41,
# - 13:17 UTC (15:17 latem / 14:17 zimą w Polsce) – świeższe przebiegi modeli przed popołudniowym raportem o 16:41.
#   Historia, dawne prognozy i SEAS5 dociągają się przyrostowo, więc drugi przebieg odświeża głównie prognozy i ensemble;
#   ma limit 8 min zamiast 35 (zaległości w nocy), żeby commit z prognozą był gotowy wcześniej.
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit zapytań ważonych Open-Meteo w jednym zadaniu"
        required: false
        default: "8000"

permissions:
  contents: write

concurrency:
  group: shared-weather
  cancel-in-progress: false

jobs:
  weather:
    strategy:
      fail-fast: false
      matrix:
        job: [temp, extra]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -r requirements.txt

      - name: Test modułu
        run: python -m pytest -q tests/test_shared_weather.py

      - name: Pobranie pogody (${{ matrix.job }})
        timeout-minutes: 45
        env:
          BUDGET: ${{ github.event.inputs.budget || '8000' }}
          # po południu krótko: świeża prognoza ma być w repozytorium przed raportem gazowym o 16:41,
          # zaległe dawne prognozy dociągają się w nocy
          MINUTES: ${{ github.event.schedule == '17 13 * * *' && '8' || '35' }}
        run: python -m mixtracker.shared_weather --job ${{ matrix.job }} --budget "$BUDGET" --minutes "$MINUTES"

      - name: Zapis w repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared_weather
          git diff --cached --quiet && exit 0
          git commit -m "Wspólna pogoda ${{ matrix.job }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          exit 1
