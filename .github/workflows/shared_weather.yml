name: Wspólna pogoda dla dashboardów

# Cała pogoda dla raportu Gaz UE (i innych dashboardów) pobierana tutaj, do data/shared_weather/:
# - zadanie "temp": temperatura dla miast UE i Azji – archiwum ERA5, bieżąca prognoza, dawne prognozy (wyprzedzenie 0-7 dni),
# - zadanie "extra": ensemble ECMWF (51 wariantów) do prognozy energetyki i prognoza sezonowa SEAS5.
# Zadania idą równolegle na osobnych maszynach (osobny limit Open-Meteo). Dwa razy dziennie, także w weekendy:
# - 00:17 UTC – pełny przebieg (zadania temp i extra; start planowany bywa opóźniony nawet o 3 godziny), przed raportem
#   gazowym o 5:41,
# - 17:47 UTC – lekki przebieg wieczorny (zadanie evening, limit 12 min): tylko świeża prognoza temperatury i ensemble
#   do energetyki, zapis w meta_evening.json; przed wieczornym raportem gazowym o 20:41 (czas polski). ERA5, dawne
#   prognozy i SEAS5 – tylko w nocy. Repozytorium jest publiczne, więc minuty GitHub Actions nie liczą się do limitu.
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit zapytań ważonych Open-Meteo w jednym zadaniu"
        required: false
        default: "8000"
      minutes:
        description: "Limit czasu pobierania w minutach (np. 100 przy jednorazowym dociąganiu historii)"
        required: false
        default: "35"
      evening:
        description: "Lekki przebieg wieczorny (tylko prognoza temperatury i ensemble)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: shared-weather
  cancel-in-progress: false

jobs:
  weather:
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON((github.event.schedule == '47 17 * * *' || github.event.inputs.evening == 'true') && '["evening"]' || '["temp","extra"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -r requirements.txt

      - name: Test modułu
        run: python -m pytest -q tests/test_shared_weather.py

      - name: Pobranie pogody (${{ matrix.job }})
        timeout-minutes: 115
        env:
          BUDGET: ${{ github.event.inputs.budget || '8000' }}
          MINUTES: ${{ matrix.job == 'evening' && '12' || github.event.inputs.minutes || '35' }}
        run: python -m mixtracker.shared_weather --job ${{ matrix.job }} --budget "$BUDGET" --minutes "$MINUTES"

      - name: Zapis w repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shared_weather
          git diff --cached --quiet && exit 0
          git commit -m "Wspólna pogoda ${{ matrix.job }} $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          exit 1
