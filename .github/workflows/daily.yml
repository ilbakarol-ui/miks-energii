name: Miks energii - aktualizacja dzienna

on:
  schedule:
    - cron: "53 0 * * *"        # codziennie 00:53 UTC = 02:53 czasu letniego w Polsce (01:53 zimą); zapas na opóźnienia startów GitHub (do ~3 h) przed odświeżeniem o 5:40
    - cron: "37 12 * * *"       # przebieg popołudniowy (codziennie): 12:37 UTC = 14:37 latem (13:37 zimą) - tylko ceny day-ahead na jutro (ok. 10 min), przed odświeżeniem o 16:40
    - cron: "7 14 * * *"        # B-20261027-1: uzupełnienie cen na jutro dla stref, których nie było przy 12:37 (2–3 min; przy komplecie bez commitu)
    # B-20261116-1: zapasowe starty – GitHub potrafi opóźnić albo pominąć zdarzenie harmonogramu (16.11: noc +6,5 h,
    # 12:37 i 14:07 UTC w ogóle nie ruszyły); bramka w kroku „need” kończy je po kilku sekundach, gdy nie są potrzebne
    - cron: "23 3 * * *"        # zapas nocny: tylko gdy brak commitu „Dane z <dziś>”
    - cron: "13 15 * * *"       # zapas popołudniowy: jak 14:07 – tylko gdy któraś strefa nie ma ceny na jutro
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit czasu pobierania w minutach"
        required: false
        default: "240"
      only:
        description: "Tylko te kraje, np. PL,DE (puste = wszystkie)"
        required: false
        default: ""
      afternoon:
        description: "Przebieg popołudniowy (tylko ceny day-ahead na jutro)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: energy-mix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      run: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # B-20261116-1: bramka zapasu nocnego sprawdza dzisiejsze commity

      # B-20261028-5: przebieg uzupełniający 14:07 UTC tylko wtedy, gdy któraś strefa nie ma jeszcze ceny na jutro
      - name: Czy brakuje cen na jutro
        id: need
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # B-20261117-1 / B-20261119-1: bramka na aktualnym main – spóźnione zdarzenie harmonogramu (GitHub opóźnia
          # starty nawet o 20 h) ma checkout z chwili utworzenia, więc nie widzi commitów, które powstały w międzyczasie
          if git fetch -q origin main 2>/dev/null; then REF=origin/main; else REF=HEAD; fi
          t=$(date -u +%Y-%m-%d); tm=$(date -u -d tomorrow +%Y-%m-%d)
          has() { git log "$REF" -80 --format=%s | grep -qxF "$1"; }
          prices_missing() {   # strefy bez ceny na jutro – z plików na $REF, nie z checkoutu
            brak=""
            for f in $(git ls-tree --name-only "$REF" data/prices/ | grep '\.csv$'); do
              d=$(git show "$REF:$f" | tail -1 | cut -d, -f1 | cut -c1-10)
              if [[ "$d" < "$tm" ]]; then brak="$brak $(basename "$f" .csv)"; fi
            done
            echo "$brak"
          }
          run=1
          # B-20261124-1: popołudniowe zdarzenie harmonogramu (12:37/14:07/15:13 UTC), które GitHub opóźnił
          # za północ UTC, jest nieaktualne – liczyłoby „popołudnie” nowego dnia przed publikacją cen na jutro
          # (24.11: starty 00:17, 01:37, 02:09 UTC dały commity „Dane z 2026-11-24 (popołudnie)” bez cen)
          h=$((10#$(date -u +%H)))
          case "$SCHEDULE" in
            "37 12 * * *"|"7 14 * * *"|"13 15 * * *")
              if [ "$h" -lt 11 ]; then
                echo "Spóźnione zdarzenie popołudniowe ($SCHEDULE) o $(date -u +%H:%M) UTC – z poprzedniego dnia, pominięte."
                echo "run=0" >> "$GITHUB_OUTPUT"; exit 0
              fi ;;
          esac
          if [ "$SCHEDULE" = "53 0 * * *" ] || [ "$SCHEDULE" = "23 3 * * *" ]; then
            # przebieg nocny i jego zapas: tylko gdy dziś nie ma jeszcze „Dane z <dziś>”
            if has "Dane z $t"; then run=0; echo "Przebieg nocny już był („Dane z $t”) – $SCHEDULE pominięty."; fi
          elif [ "$SCHEDULE" = "37 12 * * *" ]; then
            # popołudnie: pomijany, gdy popołudniowy commit już jest i wszystkie strefy mają cenę na jutro
            b=$(prices_missing)
            if has "Dane z $t (popołudnie)" && [ -z "$b" ]; then run=0; echo "Popołudnie już było, ceny na $tm komplet – pominięty."; fi
          elif [ "$SCHEDULE" = "7 14 * * *" ] || [ "$SCHEDULE" = "13 15 * * *" ]; then
            b=$(prices_missing)
            if [ -z "$b" ]; then run=0; echo "Wszystkie strefy mają cenę na $tm – przebieg uzupełniający pominięty."; else echo "Bez ceny na $tm:$b"; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # przebieg liczy na aktualnym stanie gałęzi, nie na checkoucie sprzed opóźnienia (B-20261119-1)
          if [ "$run" = "1" ] && [ "$REF" = "origin/main" ]; then git reset -q --hard origin/main; fi

      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        if: steps.need.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Testy
        if: steps.need.outputs.run == '1'
        run: python -m pytest -q

      - name: Pobranie danych, trendy, dashboard
        if: steps.need.outputs.run == '1'
        env:
          BUDGET: ${{ github.event.inputs.budget || '80' }}
          ONLY: ${{ github.event.inputs.only || '' }}
          AFTERNOON: ${{ github.event.schedule == '37 12 * * *' || github.event.schedule == '7 14 * * *' || github.event.schedule == '13 15 * * *' || github.event.inputs.afternoon == 'true' }}
          ONLY_MISSING: ${{ github.event.schedule == '7 14 * * *' || github.event.schedule == '13 15 * * *' }}
          FIRST_AFTERNOON: ${{ github.event.schedule == '37 12 * * *' }}   # B-20261103-2: bez ponowień – braki uzupełnia przebieg 14:07
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}   # U-20261027: zużycie UK/NI i dane NL z ENTSO-E (bez sekretu – pominięte)
        run: |
          if [ "$AFTERNOON" = "true" ]; then
            extra=""; [ "$ONLY_MISSING" = "true" ] && extra="--only-missing"
            [ "$FIRST_AFTERNOON" = "true" ] && extra="--no-retry"
            python -m mixtracker.run_daily --budget 40 --afternoon $extra   # B-20261025-1: zapas na 2 ponowienia brakujących cen co 10 min
          else
            python -m mixtracker.run_daily --budget "$BUDGET" --only "$ONLY"
          fi

      - name: Zapis danych w repozytorium
        if: always() && steps.need.outputs.run == '1'
        env:
          SUFFIX: ${{ (github.event.schedule == '37 12 * * *' || github.event.schedule == '7 14 * * *' || github.event.schedule == '13 15 * * *' || github.event.inputs.afternoon == 'true') && ' (popołudnie)' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # U-20261114-3: data/shared_weather zapisuje tylko „Wspólna pogoda”; przebieg dzienny bierze stamtąd
          # świeże pliki do prognoz (run_daily._refresh_shared_weather) i tutaj przywraca stan z checkoutu
          git reset -q -- data/shared_weather || true
          git checkout -q -- data/shared_weather || true
          git clean -qfd data/shared_weather || true
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Dane z $(date -u +%Y-%m-%d)${SUFFIX}"
          # do tej samej gałęzi pisze też „Wspólna pogoda” - ponowienia przy kolizji
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          echo "::error::Nie udało się zapisać danych po 5 próbach"
          exit 1

      - name: Dashboard do pobrania (zakładka Actions)
        if: steps.need.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          retention-days: 30

      - name: Przygotowanie strony GitHub Pages
        if: vars.PAGES != 'off' && steps.need.outputs.run == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    if: vars.PAGES != 'off' && needs.update.outputs.run == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
