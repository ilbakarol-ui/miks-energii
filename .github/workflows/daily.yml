name: Miks energii - aktualizacja dzienna

on:
  schedule:
    - cron: "23 5 * * *"        # 05:23 UTC = 07:23 czasu letniego w Polsce (06:23 zimą)
  workflow_dispatch:
    inputs:
      budget:
        description: "Limit czasu pobierania w minutach"
        required: false
        default: "240"
      only:
        description: "Tylko te kraje, np. PL,DE (puste = wszystkie)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: energy-mix
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m pytest -q

      - name: Pobranie danych, trendy, dashboard
        env:
          BUDGET: ${{ github.event.inputs.budget || '80' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: python -m mixtracker.run_daily --budget "$BUDGET" --only "$ONLY"

      - name: Zapis danych w repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dane z $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push

      - name: Dashboard do pobrania (zakładka Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          retention-days: 30

      - name: Przygotowanie strony GitHub Pages
        if: vars.PAGES != 'off'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    if: vars.PAGES != 'off'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
